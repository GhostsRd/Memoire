upstream mes_applications {
    # Si le serveur 1 échoue 2 fois d'affilée, Nginx l'ignore pendant 30 secondes
    server 127.0.0.1:8081 max_fails=2 fail_timeout=30s;
    
    # Le serveur 2 sert de secours
    server 127.0.0.1:8082 max_fails=2 fail_timeout=30s;
}

ou bien 


upstream mes_applications {
    server 127.0.0.1:8081;                  # Serveur principal
    server 127.0.0.1:8082 backup;           # Serveur de secours (uniquement si le 8081 est HS)
}