apiVersion: batch/v1
kind: CronJob
metadata:
  name: rclone-media-backup
spec:
  schedule: "0 2 * * *" # Exécution tous les jours à 2h du matin
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: rclone
            image: rclone/rclone:latest
            command:
            - /bin/sh
            - -c
            - |
              # Sync du dossier local vers votre serveur de backup distant (ex: via SFTP ou autre storage)
              rclone sync /data remote-backup:gpi-media-backups --config /etc/rclone/rclone.conf
            volumeMounts:
            - name: storage-data
              mountPath: /data
            - name: rclone-config
              mountPath: /etc/rclone
          restartPolicy: OnFailure
          volumes:
          - name: storage-data
            persistentVolumeClaim:
              claimName: laravel-storage-pvc
          - name: rclone-config
            secret:
              secretName: rclone-config-secret